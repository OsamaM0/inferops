# Docker service targets. Triton is scraped when its profile is running.
# Add exporter jobs here when deploying optional database/GPU exporters.
global:
  scrape_interval: 5s
  evaluation_interval: 10s
  external_labels:
    stack: inferops
scrape_configs:
- job_name: inferops-api
  metrics_path: /metrics
  static_configs:
  - targets:
    - host.docker.internal:8080
- job_name: triton
  metrics_path: /metrics
  static_configs:
  - targets:
    - triton:8002
- job_name: minio
  metrics_path: /minio/v2/metrics/cluster
  static_configs:
  - targets:
    - minio:9000
- job_name: redpanda
  metrics_path: /public_metrics
  static_configs:
  - targets:
    - redpanda:9644

- job_name: mediamtx
  static_configs:
  - targets: ["mediamtx:9998"]
