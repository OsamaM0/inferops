# Service wiring; operator settings live in configs/inferops.yaml.
name: inferops
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    environment:
      MTX_AUTHINTERNALUSERS_1_USER: ${INFEROPS_MEDIAMTX_API_USER:-inferops}
      MTX_AUTHINTERNALUSERS_1_PASS: ${INFEROPS_MEDIAMTX_API_PASSWORD:-inferops-local-api}
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: ${INFEROPS_MEDIAMTX_RECORD_RETENTION}
      MTX_PATHDEFAULTS_RECORDSEGMENTDURATION: ${INFEROPS_MEDIAMTX_RECORD_SEGMENT}
      MTX_WEBRTCADDITIONALHOSTS: ${INFEROPS_MEDIAMTX_PUBLIC_HOST}
    volumes:
    - ./deploy/media/mediamtx.yml:/mediamtx.yml:ro
    - media-recordings:/recordings
    ports:
    - 127.0.0.1:${INFEROPS_MEDIAMTX_API_PORT}:9997
    - ${INFEROPS_MEDIAMTX_BIND_ADDRESS}:${INFEROPS_MEDIAMTX_PLAYBACK_PORT}:9996
    - ${INFEROPS_MEDIAMTX_BIND_ADDRESS}:${INFEROPS_MEDIAMTX_RTSP_PORT}:8554
    - ${INFEROPS_MEDIAMTX_BIND_ADDRESS}:${INFEROPS_MEDIAMTX_WEBRTC_PORT}:8889
    - ${INFEROPS_MEDIAMTX_BIND_ADDRESS}:${INFEROPS_MEDIAMTX_HLS_PORT}:8888
    - ${INFEROPS_MEDIAMTX_BIND_ADDRESS}:8189:8189/udp
    restart: unless-stopped
  redpanda:
    image: redpandadata/redpanda:v23.3.13
    command:
    - redpanda
    - start
    - --node-id=0
    - --kafka-addr=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
    - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,EXTERNAL://${INFEROPS_KAFKA_HOST}:${INFEROPS_KAFKA_PORT}
    - --pandaproxy-addr=0.0.0.0:8082
    - --rpc-addr=0.0.0.0:33145
    - --advertise-rpc-addr=redpanda:33145
    - --check=false
    - --smp=1
    - --memory=512M
    - --reserve-memory=0M
    - --overprovisioned
    ports:
    - ${INFEROPS_KAFKA_PORT}:19092
    healthcheck:
      test:
      - CMD
      - rpk
      - cluster
      - info
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - redpanda-data:/var/lib/redpanda/data
    profiles:
    - broker
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${INFEROPS_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${INFEROPS_PG_PASSWORD:-postgres}
      POSTGRES_DB: ${INFEROPS_PG_DATABASE:-inferops}
    ports:
    - ${INFEROPS_PG_PORT}:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      retries: 10
    volumes:
    - postgres-data:/var/lib/postgresql/data
  minio:
    profiles:
    - storage
    image: inferops-minio:console
    build:
      context: .
      dockerfile: deploy/docker/minio.Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${INFEROPS_S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${INFEROPS_S3_SECRET_KEY:-minio12345}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
    - ${INFEROPS_S3_PORT}:9000
    - ${INFEROPS_MINIO_CONSOLE_PORT}:9001
    volumes:
    - minio-upstream-data:/data
  triton:
    profiles:
    - triton
    image: ${INFEROPS_TRITON_IMAGE}
    command:
    - tritonserver
    - --model-repository=/models
    - --strict-model-config=true
    - --model-control-mode=explicit
    - --load-model=*
    - --exit-on-error=true
    - --rate-limit=execution_count
    - --pinned-memory-pool-byte-size=134217728
    - --cuda-memory-pool-byte-size=0:134217728
    - --allow-metrics=true
    - --allow-gpu-metrics=true
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
    - type: bind
      source: ${INFEROPS_TRITON_REPOSITORY}
      target: /models
      read_only: true
      bind:
        create_host_path: false
    - triton-cache:/cache
    ports:
    - ${INFEROPS_TRITON_HTTP_PORT}:8000
    - ${INFEROPS_TRITON_GRPC_PORT}:8001
    - ${INFEROPS_TRITON_METRICS_PORT}:8002
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8000/v2/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      prepare:
        condition: service_completed_successfully
    shm_size: 1gb
    restart: unless-stopped
  prometheus:
    extra_hosts:
    - host.docker.internal:host-gateway
    image: prom/prometheus:v2.51.2
    volumes:
    - ${INFEROPS_PROMETHEUS_CONFIG}:/etc/prometheus/prometheus.yml:ro
    ports:
    - ${INFEROPS_PROMETHEUS_PORT}:9090
    profiles:
    - monitoring
  grafana:
    image: grafana/grafana:10.4.2
    volumes:
    - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${INFEROPS_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${INFEROPS_GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inferops-overview.json
    ports:
    - ${INFEROPS_GRAFANA_PORT}:3000
    depends_on:
    - prometheus
    profiles:
    - monitoring
  api:
    image: ${INFEROPS_IMAGE}
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      INFEROPS_PREWARM_MODELS: null
      INFEROPS_PREWARM_PIPELINES: null
    volumes:
    - &id001
      type: bind
      source: ${INFEROPS_PROJECT_ROOT}
      target: /project
      bind:
        create_host_path: false
    - ${INFEROPS_CONFIG_DIRECTORY}:/app/configs
    - evidence-spool:/var/lib/inferops/spool
    - source-data:/var/lib/inferops/sources
    - ./.run/capacity:/var/lib/inferops/capacity:ro
    - engine-data:/var/lib/inferops/data
    ports:
    - ${INFEROPS_API_PORT}:8080
    depends_on:
      mediamtx:
        condition: service_started
      redpanda:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: false
      prepare:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file: &id002
    - ${INFEROPS_CONTAINER_ENV:?Run ./run.sh to load configs/inferops.yaml}
  minio-init:
    profiles:
    - storage
    image: python:3.11-slim
    command:
    - python
    - -c
    - "import time\nimport urllib.request\nfor attempt in range(120):\n    try:\n\
      \        with urllib.request.urlopen('http://minio:9000/minio/health/ready',\
      \ timeout=2):\n            break\n    except Exception:\n        time.sleep(1)\n\
      else:\n    raise SystemExit('MinIO did not become ready')\n"
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
  prepare:
    image: ${INFEROPS_IMAGE}
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    command:
    - inferops
    - project
    - prepare
    environment:
      HF_HOME: /cache/huggingface
      INFEROPS_PREWARM_MODELS: null
      INFEROPS_PREWARM_PIPELINES: null
    volumes:
    - *id001
    - ${INFEROPS_CONFIG_DIRECTORY}:/app/configs:ro
    - hf-cache:/cache/huggingface
    restart: 'no'
    healthcheck:
      disable: true
    env_file: *id002
volumes:
  media-recordings: {}
  triton-cache: null
  postgres-data: {}
  redpanda-data: {}
  minio-upstream-data: {}
  hf-cache: {}
  evidence-spool: {}
  source-data: {}
  grafana-data: {}
  engine-data: {}
