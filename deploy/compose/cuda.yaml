services:
  api:
    image: inferops-engine:cuda
    build:
      args:
        INFERENCE_EXTRAS: cuda
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
