# Optional two-worker wiring. Configure workers in configs/inferops.yaml.
x-camera-worker: &camera-worker
  image: ${INFEROPS_IMAGE}
  command: [inferops, worker, cameras, --manifest, /app/configs/inferops.yaml, --worker-id, a]
  env_file: ["${INFEROPS_CONTAINER_ENV}"]
  environment: &worker-environment
    INFEROPS_ROLE: camera-worker
    INFEROPS_WORKER_TOKEN: ${INFEROPS_WORKER_TOKEN:?set an internal worker token}
  volumes:
    - ${INFEROPS_PROJECT_ROOT}:/project:ro
    - ${INFEROPS_CONFIG_DIRECTORY}:/app/configs:ro
    - ${INFEROPS_MEDIA_ROOT}:${INFEROPS_MEDIA_ROOT}:ro
    - source-data:/var/lib/inferops/sources
    - worker-spool-a:/var/lib/inferops/spool
  depends_on:
    postgres: {condition: service_healthy}
    minio-init: {condition: service_completed_successfully}
    triton: {condition: service_healthy}
  restart: always
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz', timeout=2)"]
    interval: 5s
    timeout: 3s
    start_period: 120s
    retries: 3
services:
  api:
    environment:
      INFEROPS_ROLE: api
      INFEROPS_WORKER_TOKEN: ${INFEROPS_WORKER_TOKEN:?set an internal worker token}
  camera-a:
    <<: *camera-worker
    environment: {<<: *worker-environment, INFEROPS_WORKER_ID: a}
  camera-b:
    <<: *camera-worker
    command: [inferops, worker, cameras, --manifest, /app/configs/inferops.yaml, --worker-id, b]
    environment: {<<: *worker-environment, INFEROPS_WORKER_ID: b}
    volumes:
      - ${INFEROPS_PROJECT_ROOT}:/project:ro
      - ${INFEROPS_CONFIG_DIRECTORY}:/app/configs:ro
      - ${INFEROPS_MEDIA_ROOT}:${INFEROPS_MEDIA_ROOT}:ro
      - source-data:/var/lib/inferops/sources
      - worker-spool-b:/var/lib/inferops/spool
volumes:
  worker-spool-a: {}
  worker-spool-b: {}
