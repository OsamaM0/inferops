services:
  api:
    image: inferops-engine:deepstream
    build:
      dockerfile: deploy/docker/deepstream.Dockerfile
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      triton: {condition: service_healthy}
