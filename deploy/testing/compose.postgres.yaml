# Disposable test database, independent of the application stack and its volumes.
name: inferops-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: inferops-test
      POSTGRES_DB: inferops_test
    ports:
      - 127.0.0.1:${INFEROPS_TEST_PG_PORT:-55432}:5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d inferops_test]
      interval: 2s
      timeout: 2s
      retries: 20
