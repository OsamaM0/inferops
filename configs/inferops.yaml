# Workspace settings; only values that differ from the defaults belong here.
# Guide: docs/configuration.md. Secrets stay in .env. Restart ./run.sh for
# runtime/service changes.
runtime:
  project: driver_behaviour
  mode: cuda  # cpu | cuda | triton
  api_port: 8082
  max_active_sources: 8
  max_sessions: 128
platform:
  runtime:
    admission:
      local_device_capacity: 8  # Upper bound for concurrent GPU calls; tune using measured FPS/VRAM
      auto_scale: true  # One GPU slot per session, up to local_device_capacity
  obs:
    log_json: false
# Defaults for NEW streams. Existing streams retain their saved settings.
sources:
  inference_fps: 30  # Target sampling limit; actual FPS depends on inference latency
projects:
  driver_behaviour:
    root: projects/driver_behaviour
    # Tunables declared in project.yaml, e.g. detection_confidence: 0.85
    settings: {}
