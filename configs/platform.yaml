# Server defaults use PostgreSQL and persistent disk. S3 and an external broker are optional.
env: dev
runtime:
  admission:
    local_device_capacity: 1
    remote_outstanding: 64
    max_pending: 1024
    max_queue_age_ms: 5000
transport:
  kind: inproc
  bootstrap: 127.0.0.1:19092
  client_id: inferops
pg:
  url: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/inferops
s3:
  endpoint: http://127.0.0.1:9000
  region: us-east-1
  access_key: minio
  secret_key: minio12345
  bucket: inferops
triton:
  url: localhost:8001
  http_url: http://localhost:8000
api:
  host: 0.0.0.0
  port: 8080
obs:
  log_level: INFO
  log_json: false
  service_name: inferops
