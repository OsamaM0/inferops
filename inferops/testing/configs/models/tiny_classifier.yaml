# Tiny CPU-only ONNX classifier used by smoke tests
# with no domain active. Generated by inferops.testing.make_tiny_model.
#
# This is the reference spec for exercising the real ONNX Runtime backend
# (session creation, provider selection, warmup, CPU/GPU fallback) without
# needing any downloaded weights.
name: tiny_classifier
version: 1
task: classification

backend: onnxruntime
artifact:
  path: model_repository/tiny_classifier/1/model.onnx

device:
  preferred: cpu
  gpu_id: 0

inputs:
  - name: input
    shape: [1, 3, 32, 32]
    dtype: float32
    layout: NCHW
    color: RGB

outputs:
  - name: logits
    shape: [1, 10]
    dtype: float32
    layout: ND
    color: NONE

labels:
  inline: [class0, class1, class2, class3, class4,
           class5, class6, class7, class8, class9]

preprocess:
  plugin: inferops.plugins.builtin.resize_normalize:ResizeNormalize
  params:
    normalize: true

postprocess:
  plugin: inferops.plugins.builtin.softmax_topk:SoftmaxTopK
  params:
    top_k: 3

batching:
  enabled: false
  max_batch_size: 1

warmup:
  iterations: 1
  dummy_input_seed: 0
