env: dev

# Primary transport: Redpanda (Kafka-compatible). Fallback: inproc.
# Override at runtime with INFEROPS_TRANSPORT_KIND=inproc for single-process
# debugging or when no broker is available.
transport:
  kind: redpanda
  bootstrap: 127.0.0.1:19092
  client_id: inferops

# Primary object storage: MinIO (S3-compatible).
s3:
  endpoint: http://127.0.0.1:9000
  region: us-east-1
  access_key: minio
  secret_key: minio12345
  bucket: inferops

# Triton Inference Server (CUDA + NVIDIA).
triton:
  url: localhost:8001
  http_url: http://localhost:8000

api:
  host: 0.0.0.0
  port: 8080
obs:
  log_level: INFO
  log_json: false
  service_name: inferops
