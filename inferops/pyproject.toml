[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferops"
version = "0.1.0"
description = "Model-agnostic ONNX inference platform: registry + pipeline DAG + fusion + alerts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  # Imported directly by inferops/core/config.py. It previously arrived only as
  # a transitive dep of pydantic-settings, so the package would break at import
  # the moment that dependency changed.
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "orjson>=3.9",
  "pyyaml>=6.0",
  "anyio>=4.3",
  "tenacity>=8.2",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pillow>=10.2",
  # Upper-bounded on purpose: the codebase targets the OpenCV 4 Python API.
  # OpenCV 5 removed `cv2.CascadeClassifier` from the default module and ships
  # no Haar cascade XMLs, which broke the face-mesh stage's Haar fallback at
  # pipeline-setup time. Lift this only after porting those call sites.
  "opencv-python-headless>=4.9,<5",
  # CPU wheel by default. `onnxruntime-gpu` must NOT be a base dependency: its
  # wheels link CUDA at import time, so on a CPU-only host `import onnxruntime`
  # dies with `ImportError: libcudart.so.N` and nothing in the package can even
  # be imported — despite the README advertising a CPU-only local mode.
  # Install the GPU wheel explicitly with the `gpu` extra.
  "onnxruntime>=1.17",
  "aiokafka>=0.10",
  "redis[hiredis]>=5.0",
  "boto3>=1.34",
  "asyncpg>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
  "websockets>=12.0",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
# GPU inference in-process. Pick the wheel matching the host CUDA major version
# and install it *instead of* the CPU wheel:
#   pip uninstall -y onnxruntime && pip install "inferops[gpu]"
gpu    = ["onnxruntime-gpu>=1.17"]
triton = ["tritonclient[grpc,http]>=2.45"]
video  = ["av>=12.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "httpx>=0.27",
  "moto[server,s3]>=5.0",
  "onnx>=1.16",
  "aiosqlite>=0.20",
]

[project.scripts]
inferops = "inferops.cli.__main__:app"

# Only the platform is packaged. Domain packs (examples/<name>, domains/<name>,
# or any directory given through INFEROPS_DOMAIN_ROOT) are loaded from disk at
# runtime, so adding or deleting one never touches this file.
[tool.setuptools.packages.find]
where = ["."]
include = ["inferops*"]

[tool.setuptools.package-data]
"inferops.testing" = ["*.py"]

[tool.ruff]
line-length = 110
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
