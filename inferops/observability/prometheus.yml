global:
  scrape_interval: 5s
  evaluation_interval: 10s
  external_labels:
    stack: inferops

scrape_configs:
  # InferOps API (runs the asyncio pipelines + emits the new metrics)
  - job_name: inferops-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8080   # native (make serve)
          - api:8080         # docker compose

  # Triton Inference Server (request count, exec time, queue time, etc.)
  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8002
          - triton:8002

  # NVIDIA DCGM exporter (per-GPU utilisation, mem, temp, power)
  - job_name: dcgm
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9400
          - dcgm-exporter:9400

  # MinIO (S3) — uses bearer-token-less /minio/v2/metrics/cluster on default
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - 127.0.0.1:9000
          - minio:9000

  # Redpanda (admin port) — Kafka producer/consumer lag, partitions
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets:
          - 127.0.0.1:19644
          - redpanda:9644

  # Postgres exporter (optional — only scraped if present)
  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9187
          - postgres-exporter:9187
