# Deterministic face-mesh stand-in for CI and for hosts without the weights.
#
# SyntheticFaceMeshBackend emits anatomically plausible 468-landmark positions
# for a 192x192 crop, so `inputs[0].shape[-1]` must stay 192 — FaceMeshStage
# divides by that value when mapping landmarks back to frame coordinates.
name: face_mesh_synth
version: 1
task: landmarks

backend: synthetic_face_mesh
device:
  preferred: cpu

inputs:
  - name: input
    shape: [1, 3, 192, 192]
    dtype: float32
    layout: NCHW
    color: RGB

outputs:
  - name: output_mesh_landmarks
    shape: [1, 1, 1404]
    dtype: float32
    layout: ND
    color: NONE
  - name: output_face_flag
    shape: [1, 1]
    dtype: float32
    layout: ND
    color: NONE

# Scenario knobs consumed by SyntheticFaceMeshBackend.load().
tags:
  drowsy: "0"
  distracted: "0"
  smoking: "0"
  face_confidence: "0.97"
  seed: "0"

batching:
  enabled: false
  max_batch_size: 1
