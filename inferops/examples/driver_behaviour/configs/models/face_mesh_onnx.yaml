# MediaPipe FaceMesh v2 run in-process through ONNX Runtime.
#
# Populated by `make setup DOMAIN=driver_behaviour` (see domain.yaml assets).
# When the artifact is absent, FaceMeshStage's `_primary_model_looks_real()`
# size check rejects it and the stage falls through to `face_mesh_synth`.
name: face_mesh_onnx
version: 1
task: landmarks

backend: onnxruntime
artifact:
  path: model_repository/face_mesh_onnx/1/model.onnx

device:
  preferred: gpu   # falls back to CPU automatically when no CUDA EP is present
  gpu_id: 0

inputs:
  - name: input_12
    shape: [1, 3, 256, 256]
    dtype: float32
    layout: NCHW
    color: RGB

outputs:
  - name: Identity
    shape: [1, 1, 1, 1434]
    dtype: float32
    layout: ND
    color: NONE
  - name: Identity_1
    shape: [1, 1, 1, 1]
    dtype: float32
    layout: ND
    color: NONE
  - name: Identity_2
    shape: [1, 1]
    dtype: float32
    layout: ND
    color: NONE

batching:
  enabled: false
  max_batch_size: 1

warmup:
  iterations: 1
  dummy_input_seed: 0
