# Synthetic stand-in for the RF-DETR driver detector.
#
# Fallback for `rfdetr_driver_triton` so the pipeline stays runnable with no
# GPU, no Triton and no downloaded weights. Emits deterministic time-varying
# detections that drive the fusion engine, which is what the smoke tests and
# the dashboard demo rely on.
name: rfdetr_driver_synth
version: 1
task: detection

backend: synthetic
device:
  preferred: cpu

inputs:
  - name: input
    shape: [1, 3, 576, 576]
    dtype: float32
    layout: NCHW
    color: RGB

outputs:
  - name: logits
    shape: [1, 20, 6]
    dtype: float32
    layout: ND
    color: NONE
  - name: boxes
    shape: [1, 20, 4]
    dtype: float32
    layout: ND
    color: NONE

labels:
  inline: [DriverBehaviour, cigarette, foodItem, phone, seatbelt, wheel]

preprocess:
  plugin: inferops.plugins.builtin.resize_normalize:ResizeNormalize
  params:
    normalize: false

postprocess:
  plugin: .plugins.postprocess_rfdetr:RFDetrPostprocess
  params:
    conf_threshold: 0.35
    # The synthetic backend deliberately emits low-variance tensors; the
    # placeholder guard is meant for accidental demo ONNX files, not this.
    reject_placeholder_outputs: false

# Scenario knobs consumed by SyntheticDetectorBackend.load():
# label=every_n_frames[@cx,cy,w,h], ';'-separated. The DriverBehaviour box is
# the centred face/torso region that enables the face-mesh stage.
tags:
  queries: "20"
  emit: "phone=3@0.55,0.55,0.20,0.18; cigarette=17@0.30,0.60,0.06,0.06; DriverBehaviour=2@0.50,0.35,0.40,0.50"
  seed: "0"

batching:
  enabled: false
  max_batch_size: 1
