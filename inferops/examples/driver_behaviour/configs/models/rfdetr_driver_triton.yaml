# RF-DETR driver-behaviour detector served by Triton (GPU path).
#
# Triton owns the execution provider and the TensorRT engine cache; see
# model_repository/rfdetr_driver_behaviour_onnx/config.pbtxt. `device` is
# advisory here — it documents intent and is surfaced on /v1/models.
name: rfdetr_driver_triton
version: 1
task: detection

backend: triton
artifact:
  triton_model_name: rfdetr_driver_behaviour_onnx

device:
  preferred: gpu
  gpu_id: 0

inputs:
  - name: input
    shape: [1, 3, 576, 576]
    dtype: float32
    layout: NCHW
    color: RGB

# The ONNX graph emits per-query class logits and cxcywh boxes. Triton reports
# them under the names declared in config.pbtxt; RFDetrPostprocess matches by
# tensor rank/shape rather than by name, so both exports work.
outputs:
  - name: dets
    shape: [1, 300, 4]
    dtype: float32
    layout: ND
    color: NONE
  - name: labels
    shape: [1, 300, 7]
    dtype: float32
    layout: ND
    color: NONE

labels:
  inline: [DriverBehaviour, cigarette, foodItem, phone, seatbelt, wheel]

# Stretch-resize, NOT letterbox: RFDetrPostprocess maps normalised cxcywh
# straight onto the original frame, which is only valid without padding.
preprocess:
  plugin: inferops.plugins.builtin.resize_normalize:ResizeNormalize
  params:
    normalize: false

postprocess:
  plugin: examples.driver_behaviour.plugins.postprocess_rfdetr:RFDetrPostprocess
  params:
    conf_threshold: 0.35

# The exported ONNX is fixed batch 1, so Triton dynamic batching stays off.
batching:
  enabled: false
  max_batch_size: 1

warmup:
  iterations: 0
