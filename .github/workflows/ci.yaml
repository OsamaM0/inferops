name: CI and Docker Hub
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferops_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      INFEROPS_TEST_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/inferops_test
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[server,cpu,video,driver_face,dev]'
      - name: Reject inward infrastructure dependencies
        run: python -m pytest tests/test_hexagonal_boundaries.py
      - run: python -m ruff check inferops tests scripts projects/driver_behaviour
      - run: python -m pytest tests
      - name: Driver alert confirmation and face regressions
        run: python -m pytest projects/driver_behaviour/tests/test_driver_behaviour.py projects/driver_behaviour/tests/test_frame_annotator.py projects/driver_behaviour/tests/test_blinkcnn_workflow.py projects/driver_behaviour/tests/test_scrfd.py projects/driver_behaviour/tests/test_face_monitoring.py projects/driver_behaviour/tests/test_face_landmarker.py
  postgres-minio:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferops
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      INFEROPS_TEST_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/inferops
      INFEROPS_TEST_S3_ENDPOINT: http://127.0.0.1:19000
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[server,cpu,video,driver_face,dev]'
      - run: docker build -f deploy/docker/minio.Dockerfile -t inferops-ci-minio .
      - run: docker run -d --name inferops-ci-minio -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 -p 19000:9000 inferops-ci-minio
      - name: Wait for real object storage
        run: |
          python - <<'PYCODE'
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:19000/minio/health/ready', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('MinIO startup failed')
          PYCODE
      - name: Required ownership, delivery and durable evidence gates
        run: python -m pytest tests/test_worker_ownership.py tests/test_worker_control.py tests/test_redesign_production.py tests/test_evidence_retention_and_bursts.py
  docker:
    name: Docker (${{ matrix.runtime }})
    needs: [contracts, postgres-minio]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [cpu, cuda, triton]
    env:
      TEST_IMAGE: inferops-ci:${{ matrix.runtime }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'osamam0' }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'osamam0/inferops-driverbeh' }}
      # Feature branches and pull requests never receive registry credentials.
      # Manual publication is allowed only from the repository's default branch.
      PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Docker Hub configuration
        if: env.PUBLISH_IMAGE == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Add the DOCKERHUB_TOKEN repository Actions secret with write access to the Docker Hub repository.'
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          platforms: linux/amd64
          build-args: INFERENCE_EXTRAS=${{ matrix.runtime }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=inferops-${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=inferops-${{ matrix.runtime }}
      - name: Smoke test CLI, runtime and packaged assets
        run: |
          docker run --rm "$TEST_IMAGE" inferops --help
          docker run --rm -i "$TEST_IMAGE" python - <<'PYCODE'
          import importlib
          import os
          from importlib.resources import files
          from pathlib import Path

          import av
          import cv2
          import fastapi
          from inferops import Engine

          runtime = os.environ['INFEROPS_IMAGE_RUNTIME']
          if runtime == 'triton':
              importlib.import_module('tritonclient.grpc')
              importlib.import_module('tritonclient.http')
          else:
              import onnxruntime
              provider = 'CUDAExecutionProvider' if runtime == 'cuda' else 'CPUExecutionProvider'
              assert provider in onnxruntime.get_available_providers()
          assets = files('inferops.adapters.inbound.http')
          for asset in ('templates/dashboard.html', 'static/dashboard.js', 'static/dashboard.css'):
              assert assets.joinpath(asset).is_file(), asset
          assert Path('/app/configs/inferops.yaml').is_file()
          print(f'{runtime} image passed smoke tests')
          PYCODE
      - name: Generate Docker tags and labels
        if: env.PUBLISH_IMAGE == 'true'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.runtime }},enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ matrix.runtime == 'cpu' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long,suffix=-${{ matrix.runtime }}
            type=semver,pattern={{version}},suffix=-${{ matrix.runtime }}
            type=semver,pattern={{version}},enable=${{ matrix.runtime == 'cpu' }}
      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Buildx reuses the layers already built and tested above.
      - name: Publish tested image to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          platforms: linux/amd64
          build-args: INFERENCE_EXTRAS=${{ matrix.runtime }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
      - name: Record published image
        if: env.PUBLISH_IMAGE == 'true'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            printf '### Published %s image\n\n' '${{ matrix.runtime }}'
            printf '```text\n%s\n```\n\n' "$IMAGE_TAGS"
            printf 'Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
