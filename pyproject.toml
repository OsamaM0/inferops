[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferops"
version = "0.1.0"
description = "Model inference and ordered pipelines with isolated sessions and recoverable evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6", "pydantic-settings>=2.2", "python-dotenv>=1.0",
  "structlog>=24.1", "orjson>=3.9", "pyyaml>=6.0", "anyio>=4.3",
  "tenacity>=8.2", "typer>=0.12", "rich>=13.7", "numpy>=1.26",
  "pillow>=10.2", "opencv-python-headless>=4.9,<5", "filelock>=3.13",
  "prometheus-client>=0.20", "opentelemetry-api>=1.24",
]

[project.optional-dependencies]
# CPU and CUDA wheels share the onnxruntime module: choose one in each environment.
cpu = ["onnxruntime>=1.17,<1.27"]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27"] # compatibility alias
triton = ["tritonclient[grpc,http]>=2.45"]
# ONNX Runtime TensorRT EP, using the CUDA 12 TensorRT 10 ABI.
tensorrt = ["onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27", "tensorrt-cu12>=10,<11"]
# SDK, GStreamer and pyds come from the NVIDIA DeepStream system/container install.
deepstream = ["tritonclient[grpc,http]>=2.45", "av>=12.0"]
video = ["av>=12.0"]
artifacts = ["onnx>=1.16", "huggingface-hub>=0.34,<2", "httpx>=0.27"]
server = [
  "aiokafka>=0.10", "redis[hiredis]>=5.0", "boto3>=1.34", "asyncpg>=0.29",
  "sqlalchemy[asyncio]>=2.0", "fastapi>=0.110", "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29", "websockets>=12.0", "httpx>=0.27",
  "onnx>=1.16", "huggingface-hub>=0.34,<2",
  "opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
]
dev = [
  "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "ruff>=0.4",
  "httpx>=0.27", "moto[server,s3]>=5.0", "onnx>=1.16", "aiosqlite>=0.20",
  "build>=1.2",
]

[project.scripts]
inferops = "inferops.adapters.inbound.cli.__main__:app"

# Only the platform is packaged. Project blocks (projects/<name>,
# or any directory given through INFEROPS_DOMAIN_ROOT) are loaded from disk at
# runtime, so adding or deleting one never touches this file.
[tool.setuptools.packages.find]
where = ["."]
include = ["inferops*"]

[tool.setuptools.package-data]
"inferops.testing" = ["*.py", "configs/**/*.yaml"]
"inferops.adapters.inbound.http" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
cache-dir = ".run/cache/ruff"
line-length = 110
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
cache_dir = ".run/cache/pytest"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
