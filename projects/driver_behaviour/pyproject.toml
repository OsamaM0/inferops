[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferops-driver-behaviour"
version = "0.1.0"
description = "Driver monitoring adapter for InferOps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["inferops>=0.1.0,<0.2"]

[project.entry-points."inferops.projects"]
driver_behaviour = "driver_behaviour"

[tool.setuptools]
# Models come from the shared library (models/ beside configs/, or INFEROPS_MODELS_DIR);
# `inferops adapters init` copies the selected ones into the new workspace.
packages = ["driver_behaviour", "driver_behaviour.plugins"]
package-dir = {driver_behaviour = "."}
include-package-data = false

[tool.setuptools.package-data]
driver_behaviour = ["project.yaml", "rules.yaml"]
