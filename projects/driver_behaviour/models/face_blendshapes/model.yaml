# Shared contract. Dictionaries merge; variant lists replace defaults.
# MediaPipe face blendshapes (Apache-2.0): 146 FaceMesh landmarks in pixel
# coordinates -> 52 ARKit-style scores. The face_mesh stage uses eyeBlink* and
# eyeLookDown* for eye state; see models/face_mesh/eyes.py.
name: face_blendshapes
defaults:
  version: 1
  task: custom
  device:
    preferred: gpu
    gpu_id: 0
  inputs:
  - name: points
    shape: [1, 146, 2]
    dtype: float32
    layout: ND
    color: NONE
  outputs:
  - name: blendshapes
    shape: [1, 52]
    dtype: float32
    layout: ND
    color: NONE
  batching:
    enabled: false
    max_batch_size: 1
  artifact:
    path: model_repository/face_blendshapes_onnx/1/model.onnx
    source:
      kind: installer
      installer: models/face_blendshapes/install.py
variants:
  onnx:
    warmup:
      iterations: 1
    backend: onnxruntime
  tensorrt:
    backend: tensorrt
    warmup:
      iterations: 1
  triton:
    backend: triton
    artifact:
      triton_model_name: face_blendshapes_onnx
