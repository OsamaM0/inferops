# Shared contract. Dictionaries merge; variant lists replace defaults.
name: rfdetr_driver
defaults:
  version: 1
  task: detection
  device:
    preferred: gpu
    gpu_id: 0
  inputs:
  - name: input
    shape:
    - 1
    - 3
    - 576
    - 576
    dtype: float32
    layout: NCHW
    color: RGB
  outputs:
  - name: dets
    shape:
    - 1
    - 300
    - 4
    dtype: float32
    layout: ND
    color: NONE
  - name: labels
    shape:
    - 1
    - 300
    - 7
    dtype: float32
    layout: ND
    color: NONE
  labels:
    inline:
    - DriverBehaviour
    - cigarette
    - foodItem
    - phone
    - seatbelt
    - wheel
  preprocess:
    plugin: inferops.adapters.outbound.inference.plugins.resize_normalize:ResizeNormalize
    params:
      normalize: true
  postprocess:
    plugin: .models.rfdetr_driver.adapter:RFDetrPostprocess
    params:
      # Only return detections with >=80% model confidence (all object classes).
      conf_threshold: 0.80
  batching:
    enabled: false
    max_batch_size: 1
  artifact:
    path: model_repository/rfdetr_driver_behaviour_onnx/1/model.onnx
    source:
      kind: google_drive
      file_id: 1NmZdondieMuqWeKOkWYPSvxBWdnUI56C
variants:
  onnx:
    backend: onnxruntime
  tensorrt:
    backend: tensorrt
  triton:
    backend: triton
    artifact:
      triton_model_name: rfdetr_driver_behaviour_onnx
