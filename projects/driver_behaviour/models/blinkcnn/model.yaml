name: blinkcnn
defaults:
  version: 1
  backend: onnxruntime
  task: classification
  device:
    preferred: gpu
    gpu_id: 0
  inputs:
  - name: crops
    shape:
    - 2
    - 1
    - 3
    - 64
    - 64
    dtype: float32
    layout: ND
    color: RGB
  outputs:
  - name: sequence
    shape:
    - 2
    - 1
    - 1
    dtype: float32
    layout: ND
    color: NONE
  artifact:
    path: model_repository/blinkcnn_onnx/1/model.onnx
    sha256: 6ae7083ad1883c5ab512d559764a9db14a45df441f189a32fd5269bf538a56b4
    source:
      kind: huggingface
      repo_id: fodorad/blink_detection
      filename: blinkcnn.onnx
      revision: 1afbaee33e9e02b9c7c912d86363ba026b9d1cf7
  batching:
    enabled: false
    max_batch_size: 1
  warmup:
    iterations: 1
  tags:
    role: Per-eye closure score; batch two eyes, one frame
    normalization: RGB /255; ImageNet normalization is inside the graph
    architecture: ConvNeXt-Femto
variants:
  onnx:
    backend: onnxruntime
  tensorrt:
    backend: tensorrt
  triton:
    backend: triton
    artifact:
      triton_model_name: blinkcnn_onnx
