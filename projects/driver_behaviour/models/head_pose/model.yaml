name: head_pose
defaults:
  version: 1
  task: landmarks
  device: {preferred: gpu, gpu_id: 0}
  inputs:
    - {name: image, shape: [1, 3, 224, 224], dtype: float32, layout: NCHW, color: RGB}
  outputs:
    - {name: rotation_matrix, shape: [1, 3, 3], dtype: float32, layout: ND, color: NONE}
  batching: {enabled: false, max_batch_size: 1}
  artifact:
    path: model_repository/head_pose_onnx/1/model.onnx
    source:
      kind: installer
      installer: models/head_pose/prepare.py
  tags:
    source: Qualcomm AI Hub SixDRepNet v0.65.0; upstream thohemp/6DRepNet
variants:
  onnx:
    backend: onnxruntime
    warmup: {iterations: 1}
  tensorrt:
    backend: tensorrt
    warmup: {iterations: 1}
  triton:
    backend: triton
    artifact: {triton_model_name: head_pose_onnx}
