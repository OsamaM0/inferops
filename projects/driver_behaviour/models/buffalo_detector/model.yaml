name: buffalo_detector
defaults:
  version: 1
  task: detection
  device: {preferred: gpu, gpu_id: 0}
  inputs:
    - {name: input.1, shape: [1, 3, 640, 640], dtype: float32, layout: NCHW, color: RGB}
  outputs:
    - {name: '448', shape: [12800, 1], dtype: float32, layout: ND, color: NONE}
    - {name: '471', shape: [3200, 1], dtype: float32, layout: ND, color: NONE}
    - {name: '494', shape: [800, 1], dtype: float32, layout: ND, color: NONE}
    - {name: '451', shape: [12800, 4], dtype: float32, layout: ND, color: NONE}
    - {name: '474', shape: [3200, 4], dtype: float32, layout: ND, color: NONE}
    - {name: '497', shape: [800, 4], dtype: float32, layout: ND, color: NONE}
    - {name: '454', shape: [12800, 10], dtype: float32, layout: ND, color: NONE}
    - {name: '477', shape: [3200, 10], dtype: float32, layout: ND, color: NONE}
    - {name: '500', shape: [800, 10], dtype: float32, layout: ND, color: NONE}
  preprocess: {plugin: '.models.buffalo_detector.adapter:SCRFDPreprocess'}
  postprocess:
    plugin: .models.buffalo_detector.adapter:SCRFDPostprocess
    # Proposals below 80% require >=80% mesh presence and valid geometry;
    # strong detections can retain head pose when eyelid landmarks fail.
    params: {candidate_threshold: 0.5, nms_threshold: 0.4}
  batching: {enabled: false, max_batch_size: 1}
  artifact:
    path: model_repository/buffalo_detector_onnx/1/model.onnx
    source:
      kind: url
      url: https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
      archive_member: det_10g.onnx
  tags:
    license: InsightFace pretrained weights are for non-commercial research; obtain appropriate rights for commercial deployment.
variants:
  onnx:
    backend: onnxruntime
    warmup: {iterations: 1}
  tensorrt:
    backend: tensorrt
    warmup: {iterations: 1}
  triton:
    backend: triton
    artifact: {triton_model_name: buffalo_detector_onnx}
