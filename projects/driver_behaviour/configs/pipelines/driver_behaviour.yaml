name: driver_behaviour
version: 1
tags:
  label: Full driver monitoring
  description: RF-DETR detection, face landmarks, drowsiness and head-pose signals, tracking, alerts and incident evidence. Use for full in-cab monitoring with both models prepared.

source:
  name: src
  stage: source_rest

stages:
  - name: decode
    stage: decode_any
    params: { every_n: 1 }

  - name: detect
    stage: infer
    params:
      model: rfdetr_driver

  # Pack-relative plugin reference: resolved against this domain's package.
  - name: face_mesh
    stage: .models.face_mesh.adapter:FaceMeshStage
    params:
      model: face_mesh
      # YuNet finds the face only to (re)acquire it; later frames track from landmarks.
      detector_model: face_detector
      # eyeBlink / eyeLookDown scores for eye state (vs. looking down at a phone).
      blendshape_model: face_blendshapes
      # FaceMesh face-presence probability needed to accept landmarks. 0.5 only
      # adds readings on ~30-40 px faces; alerts were identical on the samples.
      face_confidence_threshold: 0.80
      detector_score_threshold: 0.6
      redetect_interval_ms: 2000
      # Every frame: tracking costs one FaceMesh + one blendshape call. Raise
      # (e.g. 100) only on CPU-bound hosts; skipped frames replay the last result.
      min_infer_interval_ms: 0
      # largest | left | right: which face is the driver when several are seen.
      driver_selection: largest
      # Set true for a mirrored (selfie-style) camera image.
      mirror: false
      # "front" = the driver's road-facing pose. auto learns it per stream from
      # attentive frames (cameras are rarely on-axis); fixed uses yaw/pitch.
      neutral: { mode: auto, yaw: 0.0, pitch: 0.0, warmup_ms: 4000 }
      # Degrees away from neutral (enter / exit hysteresis).
      thresholds: { yaw_enter: 25, yaw_exit: 18, down_enter: 18, down_exit: 12, up_enter: 20, up_exit: 14 }
      eyes: { close_threshold: 0.55, open_threshold: 0.40, gaze_down_pitch_deg: 6.0 }
      # A tracked face that disappears (head turned beyond profile) is "away".
      away_after_ms: 600

  - name: fuse
    stage: fuse
    params: { fusion: driver_fusion }

  - name: alert
    stage: alert
    params: { alerts: driver_alerts }

sinks:
  - name: evidence
    stage: evidence
    params:
      annotator: .plugins.frame_annotator:DriverAnnotator
      # Application evidence policy captures every accepted incident.


tracking:
  enabled: true
  algorithm: iou_kalman
  by: stream_id
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  per_class: true
  model_filter: [rfdetr_driver]
