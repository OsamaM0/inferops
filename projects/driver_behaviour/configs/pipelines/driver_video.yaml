name: driver_video
version: 1
source:
  name: src
  stage: source_rest
stages:
  - name: decode
    stage: decode_any
    params: { every_n: 1 }
  - name: detect
    stage: infer
    params:
      model: rfdetr_driver
  - name: fuse
    stage: fuse
    params: { fusion: driver_fusion }
  - name: alert
    stage: alert
    params: { alerts: driver_alerts }
sinks:
  - name: ws
    stage: sink_ws
    params: { channel: "live.{stream_id}" }
limits: { max_concurrency: 4, queue_size: 32 }
