name: driver_video
version: 1
tags:
  label: Detector-only monitoring
  description: RF-DETR detection with phone, seatbelt, smoking and eating rules, alerts and WebSocket output. No face analysis, tracking or evidence sink. Accepts images, video and live frames; the legacy ID is driver_video.
source:
  name: src
  stage: source_rest
stages:
  - name: decode
    stage: decode_any
    params: { every_n: 1 }
  - name: detect
    stage: infer
    params:
      model: rfdetr_driver
  - name: fuse
    stage: fuse
    params: { fusion: driver_video_fusion }
  - name: alert
    stage: alert
    params: { alerts: driver_alerts }
sinks:
  - name: ws
    stage: sink_ws
    params: { channel: "live.{stream_id}" }
