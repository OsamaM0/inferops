name: driver_face
version: 1
tags:
  label: Driver face and eyes
  description: SCRFD selects the driver face; 6DRepNet360 estimates head direction
    and BlinkCNN classifies each eye using 2D106 eye locations.
source:
  name: src
  stage: source_rest
stages:
- name: decode
  stage: decode_any
  params:
    every_n: 1
- name: detect_face
  stage: .models.scrfd.adapter:FaceDetectionStage
  params:
    model: scrfd
    driver_region: null
    min_infer_interval_ms: 100
    search_tiles: true
    enhance_on_miss: true
    max_search_views: 3
    full_search_interval_ms: 1000
    negative_cache_ms: 350
    verification_model: null
    strong_confidence: 0.8
    crop_padding: 0.25
- name: head_pose
  stage: .models.head_pose_360.adapter:HeadPose360Stage
  params:
    model: head_pose_360
    crop_padding: 0.25
    min_infer_interval_ms: 100
    neutral_yaw_deg: 0.0
    neutral_pitch_deg: 0.0
    direction_yaw_threshold: 10.0
    direction_pitch_threshold: 8.0
    distraction_yaw_threshold: 25.0
    distraction_pitch_threshold: 18.0
- name: eye_landmarks
  stage: .models.landmarks_106.adapter:Landmarks106Stage
  params:
    model: landmarks_106
    min_infer_interval_ms: 100
- name: eyes
  stage: .models.blinkcnn.adapter:BlinkCNNStage
  params:
    model: blinkcnn
    min_infer_interval_ms: 100
    closed_threshold: 0.53
    open_threshold: 0.1325
    min_eye_width_px: 6.0
- name: fuse
  stage: fuse
  params:
    fusion: driver_fusion
- name: alert
  stage: alert
  params:
    alerts: driver_alerts
sinks:
- name: evidence
  stage: evidence
  params:
    annotator: .plugins.frame_annotator:DriverAnnotator
